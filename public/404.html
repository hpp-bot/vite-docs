<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面不存在</title>
  <script>
    // GitHub Pages SPA 路由支持
    const path = location.pathname;
    if (path.startsWith('/vite-docs/')) {
      const newPath = path.replace('/vite-docs', '') || '/';
      if (newPath !== '/' && !newPath.includes('.')) {
        window.location.replace('/vite-docs' + (newPath.endsWith('/') ? newPath + 'index.html' : newPath + '.html'));
      }
    }
  </script>
</head>
<body>
  <h1>页面不存在</h1>
  <p><a href="/vite-docs/">返回首页</a></p>
</body>
</html>
