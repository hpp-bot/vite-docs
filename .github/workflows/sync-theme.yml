name: Sync Theme from Private Repo

on:
  workflow_dispatch:
    inputs:
      theme_ref:
        description: 'Theme branch/tag to sync'
        required: false
        default: 'main'
  repository_dispatch:
    types: [theme-pushed]

permissions:
  contents: write

jobs:
  sync-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone private theme repo
        env:
          THEME_PAT: ${{ secrets.THEME_PAT }}
        run: |
          git clone "https://oauth2:${THEME_PAT}@github.com/hpp-bot/vite-docs-theme.git" /tmp/theme-repo

      - name: Sync theme files
        run: |
          # 备份当前主题（如果存在）
          if [ -d ".vitepress/theme" ] && [ "$(ls -A .vitepress/theme 2>/dev/null)" ]; then
            echo "Current theme exists, backing up..."
            cp -r .vitepress/theme .vitepress/theme-backup
          fi
          
          # 复制新主题
          mkdir -p .vitepress/theme
          cp -r /tmp/theme-repo/.vitepress/theme/* .vitepress/theme/
          
          # 检查是否有变更
          if git diff --quiet; then
            echo "No theme changes detected."
            exit 0
          fi
          
          echo "Theme files updated, committing..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .vitepress/theme/
          git commit -m "chore: sync theme from vite-docs-theme"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger rebuild
        run: |
          # 推送后会自动触发 deploy.yml
          echo "Theme sync complete. Deploy workflow will trigger automatically."
